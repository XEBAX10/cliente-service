# ── Propiedades requeridas por el controlador ──
api.version=v1
app.version=test

# ── JPA: crear y destruir el esquema en cada ejecucion de pruebas ──
spring.jpa.hibernate.ddl-auto=create-drop

# ── Desactivar los datos de produccion ──
# Los tests crean sus propios datos para ser predecibles
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false